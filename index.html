<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Enigma da Escola - Prólogo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="terminal-container" class="main-container">
        <pre id="texto-historia"></pre>
    </div>

    <div id="cadastro-container" class="hidden">
        <form id="cadastro-form">
            <label for="group-name">Crie um nome para o seu Grupo:</label>
            <p id="error-message" class="error-text"></p>
            <input type="text" id="group-name-input" required>
            <button id="button-grupo" type="submit">Entrar</button>
        </form>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
